[package]
name = "phidentify-ffi"
version = "0.2.0"
description = "C ABI over phidentify for the OCaml/OxCaml binding"
license = "MIT"
edition = "2024"
rust-version = "1.99"

[lib]
name = "phidentify_ffi"
crate-type = ["rlib", "staticlib"]

[features]
default = ["lightroom"]
lightroom = ["phidentify/lightroom"]
metadata = ["phidentify/metadata"]

[dependencies]
phidentify = { path = "../phidentify", default-features = false }
mimalloc = "0.1"
