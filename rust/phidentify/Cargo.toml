[package]
name = "phidentify"
version = "0.2.0"
description = "Separate, named identities for photo files: whole-file SHA-256, DNG encoded raw blocks, Lightroom original fingerprint, metadata record, preserved digest, image data"
license = "MIT"
edition = "2024"
rust-version = "1.99"

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["lightroom", "semantic"]
# Lightroom original fingerprint for supported DNG strata (decodes with rawler).
lightroom = ["dep:rawler", "dep:md-5", "dep:serde_json"]
# exiftool-rs metadata records through dng-compare's engine crate.
# Links GPL-3.0-or-later code; see dng-compare rust-scanner/exiftool-ffi/THIRD-PARTY.md.
metadata = ["dep:dng-exiftool-ffi", "dep:serde_json"]
# DNG semantic profile and SDE/0-preserved digest from a tiffgraph walk.
semantic = ["dep:tiffgraph"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
md-5 = { version = "0.11.0", optional = true }
rawler = { version = "=0.8.0", optional = true }
serde_json = { version = "1.0.151", optional = true }
tiffgraph = { git = "https://github.com/firstpair/tiffgraph", rev = "842cdac13d25e1232190e714d7924446f626c42a", optional = true }
dng-exiftool-ffi = { git = "https://github.com/firstpair/dng-compare", rev = "f68627f2a88eb5bbbd642fb7cad605e3dfa05cec", optional = true }

[dev-dependencies]
sha2 = "0.11.0"
serde_json = "1.0.151"
